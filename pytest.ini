[pytest]
testpaths = app/tests
addopts = --strict-markers
markers =
    runtime: Runtime routing, dependency recipes, workers and audio helper unit tests (no full model inference).
    installer: Installer detection, repair and environment setup unit tests.
    packaging: Offline wheelhouse and release packaging tests.
    packaging_integration: Checks requiring staged upstream engine requirements.
    model_inference: Real model/audio acceptance; opt in with --run-model-inference.
