name: main

on:
  push:
    branches: [main, master, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python unit tests
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      # Keep `uv sync` and the explicit interpreter path on the same environment.
      UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/app/.venv
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: |
            app/uv.lock
            app/pyproject.toml

      - name: Sync application environment
        run: uv sync --project app --frozen

      - name: Verify virtual environment
        run: app/.venv/Scripts/python.exe -V

      - name: Install test dependencies
        run: >
          uv pip install
          --python app/.venv/Scripts/python.exe
          pytest numpy scipy soundfile librosa torch
          --torch-backend cpu

      - name: Run unit tests
        run: app/.venv/Scripts/python.exe -m pytest app/tests -q
